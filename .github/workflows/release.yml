name: release

# A person starts this workflow from the Actions tab (claude-factory-5h9.6). This workflow
# needs no hand edits from the person.
#
# This workflow runs the "prepare" command of the script src/release.ts. That script does 3
# things: it bumps the version in package.json, it bumps the version in
# mod/.claude-plugin/plugin.json, and it moves the CHANGELOG file's Unreleased section under a
# new version heading. This workflow then opens a pull request on branch release/vX.Y.Z, with
# those 3 changes.
#
# The person reviews and merges the pull request. After the merge, the release-tag.yml
# workflow makes a tag and publishes the release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump: patch, minor or major'
        required: true
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: 'Compute the next version and print the CHANGELOG move; open no PR'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - name: bump, cut the CHANGELOG and print what prepare did
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -e
          version="$(bun src/release.ts prepare "$BUMP")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "## release: $version"
          git --no-pager diff -- package.json mod/.claude-plugin/plugin.json CHANGELOG.md
      - name: dry run stops here
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run=true: no branch, no PR, no dispatch."
          echo "The diff above is what a real run would open."
      - name: open the release PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -e
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json mod/.claude-plugin/plugin.json CHANGELOG.md
          git commit -m "release: $VERSION"
          git push origin "$branch"
          notes="$(bun src/release.ts notes "$VERSION")"
          # GitHub refuses a PR body over 65536 chars. Cut the notes and link the full CHANGELOG.
          if [ "${#notes}" -gt 60000 ]; then
            notes="${notes:0:60000}"$'\n\n'"Notes cut at 60000 chars. Full text: https://github.com/${GITHUB_REPOSITORY}/blob/${branch}/CHANGELOG.md"
          fi
          gh pr create --base main --head "$branch" --title "release: $VERSION" --body "$notes"
          # A GITHUB_TOKEN-opened PR starts no pull_request run, so ci.yml's required checks
          # never report on this head SHA unless something dispatches them. Do that here.
          gh workflow run ci.yml --ref "$branch"
