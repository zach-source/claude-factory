name: CI

# This workflow has 4 required checks on main: test, plugin, typecheck and format
# (claude-factory-5h9.5).
#
# The workflow_dispatch trigger lets release.yml start a run of this workflow on a release
# PR's branch. GITHUB_TOKEN opens that PR. A GITHUB_TOKEN-opened PR starts no pull_request run.
# So release.yml dispatches this workflow by name instead, and the checks then report against
# that PR's head SHA.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: install zsh (src/cli.test.ts spawns it)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: bun install --frozen-lockfile
      - name: bun test src factories
        # PKGGATE_E2E_REQUIRE=1 turns a missing go/npm/pip/uv/python3/zip into a named failure
        # instead of a quiet skip (claude-factory-5h9.3). This runner installs all 6 above; zip
        # ships on the ubuntu-latest image already.
        run: PKGGATE_E2E_REQUIRE=1 bun test --timeout 30000 src factories

  plugin:
    name: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: install claude 2.1.291
        run: npm install -g @anthropic-ai/claude-code@2.1.291
      - name: claude plugin test mod
        # verified needs no login and no network: HOME is a fresh empty directory.
        env:
          HOME: /tmp/claude-ci-home
        run: |
          mkdir -p "$HOME"
          claude plugin test mod

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - name: tsc --noEmit -p .
        run: bunx tsc --noEmit -p .
      # This job skips `tsc -p mod` on purpose. It needs mod/.claude-plugin/types/, a
      # directory only a live Claude Code session writes, when it loads the mod. Proof: `claude
      # plugin test mod` does not write that directory. Without it, tsc fails with TS5083,
      # "Cannot read file .../types/tsconfig.json". No unattended CI step can make that
      # directory. docs/releasing.md records the same reason.

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bunx prettier@3.9.9 --check .
