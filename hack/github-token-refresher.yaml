# Keeps factory-keys' github and github-basic fresh with a nixfleet-axel GitHub App installation token
# (they expire after an hour). The gateway's credential provider reads the Secret on every request.
# The App's private key goes in Secret axel-github-app (key private-key), created from 1Password.
apiVersion: v1
kind: ServiceAccount
metadata: { name: github-token-refresher, namespace: factory-spike-ax }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: github-token-refresher, namespace: factory-spike-ax }
rules:
  - { apiGroups: [''], resources: [secrets], resourceNames: [factory-keys], verbs: [get, patch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: github-token-refresher, namespace: factory-spike-ax }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: github-token-refresher }
subjects: [{ kind: ServiceAccount, name: github-token-refresher, namespace: factory-spike-ax }]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: github-token-refresher, namespace: factory-spike-ax }
spec:
  schedule: '*/30 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: github-token-refresher
          restartPolicy: OnFailure
          nodeSelector: { kubernetes.io/arch: amd64 }
          containers:
            - name: refresh
              image: alpine:3.22
              env:
                - { name: APP_ID, value: '2954702' }
                - { name: INSTALLATION_ID, value: '112589902' }
              volumeMounts: [{ name: app, mountPath: /app, readOnly: true }]
              command: [/bin/sh, -euc]
              args:
                - |
                  apk add --no-cache -q openssl curl jq
                  b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
                  now=$(date +%s)
                  h=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
                  p=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)
                  s=$(printf '%s.%s' "$h" "$p" | openssl dgst -sha256 -sign /app/private-key | b64)
                  t=$(curl -fsS -X POST -H "Authorization: Bearer $h.$p.$s" -H 'Accept: application/vnd.github+json' \
                    "https://api.github.com/app/installations/$INSTALLATION_ID/access_tokens" | jq -er .token)
                  gh=$(printf %s "$t" | openssl base64 -A)
                  basic=$(printf 'x-access-token:%s' "$t" | openssl base64 -A | openssl base64 -A)
                  sa=/var/run/secrets/kubernetes.io/serviceaccount
                  curl -fsS -o /dev/null --cacert $sa/ca.crt -H "Authorization: Bearer $(cat $sa/token)" \
                    -X PATCH -H 'Content-Type: application/merge-patch+json' \
                    -d "{\"data\":{\"github\":\"$gh\",\"github-basic\":\"$basic\"}}" \
                    "https://kubernetes.default.svc/api/v1/namespaces/$(cat $sa/namespace)/secrets/factory-keys"
                  echo "refreshed factory-keys github token at $(date -u +%FT%TZ)"
          volumes: [{ name: app, secret: { secretName: axel-github-app, defaultMode: 0400 } }]
