# The policy broker (docs/remote-runner.md, Policy broker). Set BROKER_IMAGE to the image, by digest, and apply:
#   BROKER_IMAGE=<registry>/factory-broker@sha256:<digest> envsubst '$BROKER_IMAGE $CLAUDE_TOKEN_ITEM $CLAUDE_TOKEN_VAULT $CLAUDE_TOKEN_LIVE_FIELD $CLAUDE_TOKEN_SLOT_FIELD $CLAUDE_TOKEN_ACTIVE_FIELD' < deploy/broker.yaml | kubectl apply -f -
# The CLAUDE_TOKEN_* values are bin/claude-token's variables. Leave CLAUDE_TOKEN_ITEM empty and POST /token/best is
# not served. The op writer token is the Secret claude-token-op (key token) in namespace factory-broker.
# Make it by hand, outside this file: kubectl -n factory-broker create secret generic claude-token-op --from-literal=token=<op token>
apiVersion: v1
kind: Namespace
metadata:
  name: factory-broker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-policy-broker
  namespace: factory-broker
---
# the egress gateway's CA, which GET /ca reads
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factory-policy-broker
rules:
  - apiGroups: ['certificates.k8s.io']
    resources: ['clustertrustbundles']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factory-policy-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: factory-policy-broker
subjects:
  - kind: ServiceAccount
    name: factory-policy-broker
    namespace: factory-broker
---
# GET /controller: get on the one Deployment ax-controller, nothing else
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-policy-broker
  namespace: ax-system
rules:
  - apiGroups: ['apps']
    resources: ['deployments']
    resourceNames: ['ax-controller']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-policy-broker
  namespace: ax-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-policy-broker
subjects:
  - kind: ServiceAccount
    name: factory-policy-broker
    namespace: factory-broker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-policy-broker
  namespace: factory-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factory-policy-broker
  template:
    metadata:
      labels:
        app: factory-policy-broker
    spec:
      serviceAccountName: factory-policy-broker
      automountServiceAccountToken: true
      containers:
        - name: broker
          image: ${BROKER_IMAGE}
          args: ['--port', '8080']
          env:
            - name: FACTORY_BROKER_ATESPACES
              value: factory
            - name: FACTORY_BROKER_ENDPOINT
              value: api.ate-system.svc:443
            - { name: CLAUDE_TOKEN_ITEM, value: '${CLAUDE_TOKEN_ITEM}' }
            - { name: CLAUDE_TOKEN_VAULT, value: '${CLAUDE_TOKEN_VAULT}' }
            - { name: CLAUDE_TOKEN_LIVE_FIELD, value: '${CLAUDE_TOKEN_LIVE_FIELD}' }
            - { name: CLAUDE_TOKEN_SLOT_FIELD, value: '${CLAUDE_TOKEN_SLOT_FIELD}' }
            - { name: CLAUDE_TOKEN_ACTIVE_FIELD, value: '${CLAUDE_TOKEN_ACTIVE_FIELD}' }
            - name: OP_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef: { name: claude-token-op, key: token, optional: true }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          volumeMounts:
            - name: ate-api-token
              mountPath: /var/run/secrets/ate-api
              readOnly: true
      volumes:
        - name: ate-api-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: factory-policy-broker
  namespace: factory-broker
spec:
  selector:
    app: factory-policy-broker
  ports:
    - port: 8080
      targetPort: 8080
---
# Only the egress gateway's namespace can call the broker: the manager's calls arrive from the gateway.
# Confirm the gateway namespace and pod labels before apply.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: factory-policy-broker
  namespace: factory-broker
spec:
  podSelector:
    matchLabels:
      app: factory-policy-broker
  policyTypes: ['Ingress']
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
      ports:
        - protocol: TCP
          port: 8080
