# The policy broker (docs/remote-runner.md, Policy broker). Set BROKER_IMAGE to the image, by digest, and
# FACTORY_AX_VAULT to the agent-vault vault of the workers, and apply:
#   BROKER_IMAGE=<registry>/factory-broker@sha256:<digest> FACTORY_AX_VAULT=<vault> \
#     envsubst '$BROKER_IMAGE $FACTORY_AX_VAULT' < deploy/broker.yaml | kubectl apply -f -
apiVersion: v1
kind: Namespace
metadata:
  name: factory-broker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-policy-broker
  namespace: factory-broker
---
# the egress gateway's CA, which GET /ca reads
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factory-policy-broker
rules:
  - apiGroups: ['certificates.k8s.io']
    resources: ['clustertrustbundles']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factory-policy-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: factory-policy-broker
subjects:
  - kind: ServiceAccount
    name: factory-policy-broker
    namespace: factory-broker
---
# the AX controller's Deployment, which GET /ax-ready reads
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-policy-broker
  namespace: ax-system
rules:
  - apiGroups: ['apps']
    resources: ['deployments']
    resourceNames: ['ax-controller']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-policy-broker
  namespace: ax-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-policy-broker
subjects:
  - kind: ServiceAccount
    name: factory-policy-broker
    namespace: factory-broker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-policy-broker
  namespace: factory-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factory-policy-broker
  template:
    metadata:
      labels:
        app: factory-policy-broker
    spec:
      serviceAccountName: factory-policy-broker
      automountServiceAccountToken: true
      containers:
        - name: broker
          image: ${BROKER_IMAGE}
          args: ['--port', '8080']
          # the image runs as user bun, and the broker writes nothing to disk
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          env:
            # the manager task name; the broker never changes its policy. Match FACTORY_AX_MANAGER on the laptop
            - name: FACTORY_AX_MANAGER
              value: f-manager
            # the vault a policy may name; the broker refuses a credential from any other
            - name: FACTORY_AX_VAULT
              value: ${FACTORY_AX_VAULT}
            - name: FACTORY_BROKER_ATESPACES
              value: factory
            - name: FACTORY_BROKER_ENDPOINT
              value: api.ate-system.svc:443
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          volumeMounts:
            - name: ate-api-token
              mountPath: /var/run/secrets/ate-api
              readOnly: true
      volumes:
        - name: ate-api-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: factory-policy-broker
  namespace: factory-broker
spec:
  selector:
    app: factory-policy-broker
  ports:
    - port: 8080
      targetPort: 8080
---
# The manager VM's traffic leaves through the egress gateway, so only the gateway reaches the broker.
# ponytail: the gateway pods' labels are not in this repo, so this selects their namespace (ate-system), not the pods.
# Narrow it with a podSelector on the gateway Deployment's labels when you know them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: factory-policy-broker
  namespace: factory-broker
spec:
  podSelector:
    matchLabels:
      app: factory-policy-broker
  policyTypes: ['Ingress']
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
      ports:
        - port: 8080
          protocol: TCP
