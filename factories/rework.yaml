# One station: unstick a pull request labeled `conflict` (its branch conflicts with its base) or `rework`
# (it needs changes before it can merge). The label pass starts it (and takes the labels off); its goal
# names the PR, its labels, its branch and its base.
name: rework
start: resolve
agent: "{claude} --dangerously-skip-permissions --model '{exec_model}'"
params:
  claude: claude-smart --new --no-channels
  exec_model: claude-sonnet-5[1m]
rules: |-
  - Read the repo's CLAUDE.md, AGENTS.md or CONTRIBUTING first; its conventions and commands win over your habits.
  - Change what the PR needs and nothing else. Never skip or weaken a test, never rebase or force-push.
nodes:
  resolve:
    prompt: |-
      Your goal names a stuck pull request and what its labels ask. First triage it: `gh pr view <number> --comments`, its reviews (`gh api repos/{owner}/{repo}/pulls/<number>/reviews`) and `gh pr checks <number>`.
      - If it is no longer wanted (its change is already on the base, another PR supersedes it, or its reviews reject the idea), `gh pr comment <number>` saying why, `gh pr edit <number> --add-label close` so the factory closes it, and report obsolete.
      Otherwise:
      1. `git fetch origin <branch> <base>`, then `git checkout --detach origin/<branch>`: the branch may be checked out in another worktree, so you push by ref.
      2. For conflicts: `git merge origin/<base>`, resolving each conflict keeping both sides' intent.
      3. For rework: make the changes the unresolved review comments and failing checks ask for. A request you disagree with gets a reply on the PR, not a silent skip.
      4. Build and run the tests the repo defines, and fix what you broke.
      5. Commit, `git push origin HEAD:<branch>`, and `gh pr comment <number>` with what you changed and how you checked it.
      Where the intent of a conflict or a review is unclear, stop: `gh pr comment <number>` with what needs a person and why, and report cannot.
    next:
      resolved: done
      obsolete: done
      cannot: done
    timeoutMin: 60
