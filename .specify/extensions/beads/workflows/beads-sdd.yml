schema_version: "1.0"

workflow:
  id: beads-sdd
  name: "Spec Kit with Beads"
  version: "1.0.0"
  author: "Sidekick contributors"
  description: "Runs specify → plan → Beads task planning → Beads implementation."

requires:
  speckit_version: ">=1.0.0"
  integrations:
    any:
      - codex
      - claude
      - copilot
      - gemini
      - opencode

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use; 'auto' uses the project's active integration"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated specification before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the implementation plan before creating Beads work."
    options: [approve, reject]
    on_reject: abort

  - id: beads-tasks
    command: speckit.beads.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: beads-implement
    command: speckit.beads.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "all"
